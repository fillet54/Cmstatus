{% extends "base.html" %}
{% from "macros.html" import page_header %}
{% block title %}Events{% endblock %}
{% block content %}
{{ page_header("Events", "Append-only status accounting log, newest first.") }}

<form class="flex flex-wrap gap-2 items-center" action="{{ url_for('ui.events') }}"
      hx-get="{{ url_for('ui.events') }}" hx-target="#event-rows" hx-push-url="true"
      hx-trigger="change, input changed delay:300ms from:input[name=entity_id], submit">
  <select name="entity" class="select select-bordered select-sm">
    <option value="">All entities</option>
    {% for e in entities %}<option {{ 'selected' if filters.entity == e }}>{{ e }}</option>{% endfor %}
  </select>
  <input type="number" name="entity_id" min="1" value="{{ filters.entity_id or '' }}" placeholder="id"
         class="input input-bordered input-sm w-24">
  <span class="loading loading-spinner loading-sm htmx-indicator"></span>
</form>

<div class="card bg-base-100 shadow-sm">
  <div class="overflow-x-auto">
    <table class="table table-sm">
      <thead><tr><th>#</th><th>At (UTC)</th><th>Entity</th><th>Action</th><th>Detail</th></tr></thead>
      <tbody id="event-rows">{% include "_event_rows.html" %}</tbody>
    </table>
  </div>
</div>
{% endblock %}
