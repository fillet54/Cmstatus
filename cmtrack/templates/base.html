<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}cmtrack{% endblock %} · cmtrack</title>
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "light"; } catch (e) {}</script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body class="min-h-screen bg-base-200" hx-boost="true" hx-headers='{"X-UI-Layout": "legacy"}'>
  {% set nav = [("ui.dashboard", "Dashboard"), ("ui.cis", "CIs"), ("ui.backlogs", "Backlogs"), ("ui.ifcs", "IFCs"),
                ("ui.events", "Events")] %}
  <div class="navbar bg-base-100 shadow-sm px-4">
    <div class="flex-1 gap-2">
      <a href="{{ url_for('ui.dashboard') }}" class="text-lg font-bold mr-4">cmtrack</a>
      <ul class="menu menu-horizontal px-1 gap-1">
        {% for endpoint, label in nav %}
        <li><a href="{{ url_for(endpoint) }}"
               class="{{ 'active' if request.endpoint == endpoint or (request.blueprint == 'ui' and section == endpoint) }}">{{ label }}</a></li>
        {% endfor %}
      </ul>
    </div>
    <div class="flex-none gap-2">
      <a href="{{ url_for('api.index') }}" class="btn btn-ghost btn-sm" hx-boost="false">API</a>
      <label class="swap swap-rotate btn btn-ghost btn-sm btn-circle" title="Toggle theme">
        <input type="checkbox" id="theme-toggle">
        <span class="swap-off">☀</span><span class="swap-on">☾</span>
      </label>
    </div>
  </div>

  <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
    {% block content %}{% endblock %}
  </main>

  <script>
    (function () {
      var t = document.getElementById("theme-toggle");
      t.checked = document.documentElement.dataset.theme === "dark";
      t.addEventListener("change", function () {
        var theme = t.checked ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        try { localStorage.setItem("theme", theme); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
