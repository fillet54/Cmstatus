[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cmtrack"
version = "0.1.0"
description = "Configuration tracking for CSCIs, releases, versions, IFCs and HSCM baselines."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Phillip Gomez" }]
dependencies = ["flask"]

[project.scripts]
cmtrack = "cmtrack.__main__:main"

[tool.setuptools]
packages = ["cmtrack"]

[tool.setuptools.package-data]
cmtrack = ["schema.sql", "static/*", "templates/*.html", "templates/ui/*.html"]
